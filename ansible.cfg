# ansible.cfg
# =============================================================================
# RHEL 10 Ansible Configuration
# =============================================================================
[defaults]
# Recursive dict merging: environment/region/platform overrides only need to
# specify changed values. Ansible merges them into the base group_vars
# automatically. Without this, any dict override REPLACES the entire base dict.
hash_behaviour = merge

collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
roles_path = roles/qbe/rhel:~/.ansible/roles:/usr/share/ansible/roles
interpreter_python = auto_silent

# Performance
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

# Output
stdout_callback = yaml
callback_whitelist = timer, profile_tasks

# SSH
host_key_checking = false
timeout = 30
pipelining = true

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = true
