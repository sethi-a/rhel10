---
- name: "Day 1 — Compliance Verification (JT4)"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/libexec/platform-python
    cis_max_remediation_attempts: 2

  tasks:

    # --- CIS: OpenSCAP compliance scan with remediation loop ---
    - name: Run CIS compliance check (scan → remediate → rescan)
      ansible.builtin.include_role:
        name: cis_compliance
      vars:
        cis_remediate: true
        cis_max_attempts: "{{ cis_max_remediation_attempts }}"

    # --- Publish compliance results for workflow decisions ---
    - name: Publish compliance results
      ansible.builtin.set_stats:
        data:
          qualys_scan_completed: "{{ qualys_scan_result.completed | default(true) }}"
          cis_score: "{{ cis_compliance_score | default('unknown') }}"
          cis_pass: "{{ (cis_compliance_score | default(0) | float) >= cis_profile.minimum_score }}"