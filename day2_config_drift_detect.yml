# playbooks/d2_drift_detect.yml
---
# =========================================================================
# Play 1: Scan all hosts — baseline comparison + AIDE integrity check
# =========================================================================
- name: "Day 2 -- Drift Detection Scan"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  serial: "{{ detect_serial | default('20%') }}"
  gather_facts: true
  vars:
    drift_auto_remediate: >-
      {{ hostvars[inventory_hostname].drift_auto_remediate
         | default(environment != 'prod') }}

  tasks:
    # --- Baseline comparison (packages, services, sysctl, SSH, PAM, etc.) ---
    - name: Run baseline comparison checks
      ansible.builtin.include_role:
        name: baseline_check


    # --- Map drifted categories to Day 1 remediation roles ---
    # Mappings loaded from group_vars/all/rhel10_remediation.yml:
    #   category_role_map  — baseline category → Day 1 role
    #   agent_role_map     — agent name → Day 1 install role

    - name: Identify drifted categories
      ansible.builtin.set_fact:
        _drifted_categories: >-
          {{ drift_results.categories | dict2items
             | selectattr('value.status', 'equalto', 'drifted')
             | map(attribute='key') | list }}

    - name: Map drifted categories to Day 1 roles
      ansible.builtin.set_fact:
        _drifted_roles_from_categories: >-
          {{ _drifted_categories
             | reject('equalto', 'agents')
             | map('extract', category_role_map)
             | select('string')
             | unique | list }}

    - name: Map drifted agents to Day 1 roles
      ansible.builtin.set_fact:
        _drifted_roles_from_agents: >-
          {{ (drift_results.categories.agents.drift_items | default([]))
             | map(attribute='item')
             | map('extract', agent_role_map)
             | select('defined')
             | unique | list }}
      when: "'agents' in _drifted_categories"

    - name: Build role_drift list
      ansible.builtin.set_fact:
        _role_drift: []

    - name: Add roles to drift list
      ansible.builtin.set_fact:
        _role_drift: "{{ _role_drift + [{'role': item, 'changed': true}] }}"
      loop: "{{ (_drifted_roles_from_categories + (_drifted_roles_from_agents | default([]))) | unique }}"

    # --- Consolidate per-host results ---
    - name: Build consolidated per-host drift fact
      ansible.builtin.set_fact:
        host_drift_summary:
          hostname: "{{ inventory_hostname }}"
          region: "{{ region }}"
          environment: "{{ environment }}"
          platform: "{{ platform | default('unknown') }}"
          scan_timestamp: "{{ ansible_date_time.iso8601 }}"
          auto_remediate: "{{ drift_auto_remediate }}"
          baseline_drift: "{{ drift_results }}"
          role_drift: "{{ _role_drift }}"
          has_drift: >-
            {{ drift_results.has_drift }}

# =========================================================================
# Play 2: Consolidate results — generate report, create ticket, send email
# =========================================================================
- name: "Day 2 -- Drift Detection Consolidation"
  hosts: localhost
  gather_facts: true
  connection: local
  vars:
    report_filename: "drift-report-{{ ansible_date_time.date }}.html"
    report_path: "/tmp/{{ report_filename }}"

  tasks:
    # Build list of hosts from Play 1
    - name: Collect hosts that ran in Play 1
      ansible.builtin.set_fact:
        scan_targets: >-
          {{ groups.get(target_hosts | default('all'), groups['all']) }}
        all_results: >-
          {{ groups.get(target_hosts | default('all'), groups['all'])
             | map('extract', hostvars, 'host_drift_summary')
             | list }}

    - name: Set consolidation facts
      ansible.builtin.set_fact:
        drifted_hosts: >-
          {{ all_results | selectattr('has_drift', 'equalto', true) | list }}
        clean_hosts: >-
          {{ all_results | rejectattr('has_drift', 'equalto', true) | list }}
        total_scanned: "{{ all_results | length }}"
        total_drifted: "{{ (all_results | selectattr('has_drift', 'equalto', true) | list) | length }}"
        total_clean: "{{ (all_results | rejectattr('has_drift', 'equalto', true) | list) | length }}"

    - name: Calculate drift percentage
      ansible.builtin.set_fact:
        drift_percentage: >-
          {{ ((total_drifted | int / total_scanned | int) * 100) | round(1) if total_scanned | int > 0 else 0 }}
        env_summary: >-
          {{ all_results | groupby('environment') | items2dict(key_name=0, value_name=1) }}
          
    - name: Generate HTML drift report
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/drift_report.html.j2"
        dest: "{{ report_path }}"
        mode: "0644"
      vars:
        report_data:
          scan_date: "{{ ansible_date_time.iso8601 }}"
          total_scanned: "{{ total_scanned }}"
          total_drifted: "{{ total_drifted }}"
          total_clean: "{{ total_clean }}"
          drift_percentage: "{{ drift_percentage }}"
          drifted_hosts: "{{ drifted_hosts }}"
          clean_hosts: "{{ clean_hosts }}"
          env_summary: "{{ env_summary }}"

    - name: Copy report to Satellite web server
      ansible.builtin.copy:
        src: "{{ report_path }}"
        dest: "/var/www/html/reports/drift/{{ report_filename }}"
        mode: "0644"
      delegate_to: node1.example.com
      become: true

    - name: Store drift summary as workflow artifact
      ansible.builtin.set_stats:
        data:
          drift_scan_date: "{{ ansible_date_time.iso8601 }}"
          drift_total_scanned: "{{ total_scanned }}"
          drift_total_drifted: "{{ total_drifted }}"
          drift_percentage: "{{ drift_percentage }}"
          
