# =============================================================================
# IMAGE BUILD CONFIGURATION
# =============================================================================
# Settings consumed ONLY by generate_blueprint_toml.yml when creating the
# Image Builder blueprint TOML. These are Day 0 image-build concerns that
# do not participate in Day 2 drift detection.
#
# - common_packages: OS packages needed in the image but not drift-checked
#   (they are foundational and cannot be removed without breaking the VM)
# - users: service accounts baked into the golden image
# - partitions: filesystem layout with sizes (baseline.filesystem_mounts
#   tracks mount options only; this section adds sizes for image creation)
# - timezone, locale, kernel_append: image defaults
# =============================================================================
image_config:
  common_packages:
    - python3
    - sudo
    - selinux-policy-targeted
    - scap-security-guide

  users:
    - name: ansibleadm
      description: "Ansible Automation Service Account"
      groups:
        - wheel
      uid: 2000
      gid: 2000
      ssh_key: "ssh-rsa CHANGEME ansibleadm@qbe.com"
    - name: hsekeep
      description: "Housekeeping Service Account"
      uid: 2001
      gid: 2001
      ssh_key: "ssh-rsa CHANGEME hsekeep@qbe.com"

  timezone: "UTC"
  locale:
    languages:
      - "en_US.UTF-8"
    keyboard: "us"

  kernel_append: "audit=1 audit_backlog_limit=8192 crashkernel=auto"

  partitions:
    - mountpoint: /
      size: 10737418240
      type: xfs
    - mountpoint: /boot
      size: 1073741824
      type: xfs
    - mountpoint: /boot/efi
      size: 629145600
      type: vfat
    - mountpoint: /home
      size: 2147483648
      type: xfs
    - mountpoint: /tmp
      size: 2147483648
      type: xfs
    - mountpoint: /var
      size: 10737418240
      type: xfs
    - mountpoint: /var/log
      size: 5368709120
      type: xfs
    - mountpoint: /var/log/audit
      size: 3221225472
      type: xfs
    - mountpoint: /var/tmp
      size: 2147483648
      type: xfs