# vars/rhel10_image_config.yml
# =============================================================================
# Day 0 — Image Builder Configuration
# =============================================================================
# Defines the golden image build parameters consumed ONLY by the blueprint
# generation playbook (playbooks/generate_blueprint_toml.yml).
#
# This file is NOT consumed by Day 1 or Day 2 playbooks. It is separated
# from rhel10_vm_baseline.yml to keep image build concerns independent of runtime
# baseline configuration.
#
# Consumed by:
#   - Day 0: generate_blueprint_toml.yml reads this to produce per-platform
#            Image Builder TOML blueprints
#
# Maintenance:
#   - All changes require a Git pull request and peer review.
#   - Platform-specific packages are in group_vars/platform_*/baseline.yml
#     (packages_platform_required variable).
# =============================================================================
---
image_config:
  version: "1.0.0"

  # Packages included in the golden image (minimal — just enough to boot
  # and be configurable by Day 1 roles)
  common_packages:
    - python3
    - sudo
    - selinux-policy-targeted
    - scap-security-guide

  # Packages that must NOT be present on hardened systems
  prohibited_packages:
    - name: telnet-server
    - name: telnet
    - name: rsh-server
    - name: rsh

  # Filesystem mount options applied at image build time
  filesystem_mounts:
    /tmp:
      options: [nodev, nosuid, noexec]
    /var/tmp:
      options: [nodev, nosuid, noexec]
    /dev/shm:
      options: [nodev, nosuid, noexec]
    /home:
      options: [nodev, nosuid]

  # Service accounts baked into the image
  users:
    - name: ansibleadm
      description: "Ansible Automation Service Account"
      groups:
        - wheel
      uid: 2000
      gid: 2000
      ssh_key: "ssh-rsa CHANGEME ansibleadm@qbe.com"
    - name: hsekeep
      description: "Housekeeping Service Account"
      uid: 2001
      gid: 2001
      ssh_key: "ssh-rsa CHANGEME hsekeep@qbe.com"

  # Timezone and locale
  timezone: "UTC"
  locale:
    languages:
      - "en_US.UTF-8"
    keyboard: "us"

  # Kernel boot parameters
  kernel_append: "audit=1 audit_backlog_limit=8192 crashkernel=auto"

  # Filesystem partition layout
  partitions:
    - mountpoint: /
      size: 10737418240
      type: xfs
    - mountpoint: /boot
      size: 1073741824
      type: xfs
    - mountpoint: /boot/efi
      size: 629145600
      type: vfat
    - mountpoint: /home
      size: 2147483648
      type: xfs
    - mountpoint: /tmp
      size: 2147483648
      type: xfs
    - mountpoint: /var
      size: 10737418240
      type: xfs
    - mountpoint: /var/log
      size: 5368709120
      type: xfs
    - mountpoint: /var/log/audit
      size: 3221225472
      type: xfs
    - mountpoint: /var/tmp
      size: 2147483648
      type: xfs
