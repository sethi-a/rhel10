# playbooks/generate_blueprint_toml.yml
# =============================================================================
# Generates an Image Builder blueprint TOML for the specified platform.
# Variables are loaded explicitly via include_vars (not auto-loaded from
# group_vars) because baseline.yml contains Jinja lookups (region, platform)
# that are only resolvable on managed hosts, not localhost.
#
# Run:
#   ansible-playbook playbooks/generate_blueprint_toml.yml -e platform=azure
#   ansible-playbook playbooks/generate_blueprint_toml.yml -e platform=vcenter
#
# Output: files/rhel10-<platform>.toml
# =============================================================================
---
- name: "Generate Image Builder Blueprint for {{ platform }}"
  hosts: all
  gather_facts: true
  connection: local
  vars:
    vars_dir: "{{ playbook_dir }}/group_vars"
    image_vars_dir: "{{ playbook_dir }}/vars"
    output_dir: "{{ playbook_dir }}/blueprints"

  tasks:
    - name: Validate platform is specified
      ansible.builtin.assert:
        that:
          - platform is defined
          - platform in ['azure', 'vcenter']
        fail_msg: "Specify platform via -e platform=azure or -e platform=vcenter"

    - name: Load image config variables
      ansible.builtin.include_vars:
        file: "{{ image_vars_dir }}/rhel10_image_config.yml"

    - name: Load CIS profile variables
      ansible.builtin.include_vars:
        file: "{{ vars_dir }}/all/rhel10_cis_profile.yml"

    - name: Load platform override variables
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}/platform_{{ platform }}"

    - name: Validate required sections exist
      ansible.builtin.assert:
        that:
          - image_config is defined
          - image_config['common_packages'] is defined
          - image_config['partitions'] is defined
          - image_config['users'] is defined
          - image_config['prohibited_packages'] is defined
          - image_config['filesystem_mounts'] is defined
          - image_config['version'] is defined
          - rhel10_cis_profile is defined
          - rhel10_cis_profile['base_profile'] is defined
        fail_msg: "rhel10_vm_baseline.yml must contain packages, image_config (with common_packages, partitions, users), and firewall; rhel10_cis_profile.yml must contain rhel10_cis_profile"

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Generate blueprint TOML
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/rhel10_image_blueprint.toml.j2"
        dest: "{{ output_dir }}/rhel10_{{ platform }}_blueprint.toml"
        mode: "0644"
      vars:
        platform_name: "{{ platform }}"
        platform_packages: "{{ packages_platform_required | default([]) }}"

    - name: Read generated TOML content
      ansible.builtin.slurp:
        src: "{{ output_dir }}/rhel10_{{ platform }}_blueprint.toml"
      register: toml_content

    - name: Display generated TOML
      ansible.builtin.debug:
        msg: "{{ (toml_content.content | b64decode) }}"

    - name: Set stats for AAP artifacts
      ansible.builtin.set_stats:
        data:
          blueprint_toml_content: "{{ (toml_content.content | b64decode) }}"
          blueprint_platform: "{{ platform }}"
          blueprint_base_packages: "{{ packages['required'] | length }}"
          blueprint_platform_packages: "{{ packages_platform_required | default([]) | length }}"

    - name: Report generation summary
      ansible.builtin.debug:
        msg: |
          Blueprint TOML generated successfully:
            - Output: {{ output_dir }}/rhel10_{{ platform }}_blueprint.toml
            - Platform: {{ platform }}
            - Common packages: {{ image_config['common_packages'] | length }}
            - Platform packages: {{ packages_platform_required | default([]) | length }}
            - Prohibited packages: {{ image_config['prohibited_packages'] | length }}
            - Partitions: {{ image_config['partitions'] | length }}
            - CIS profile: {{ rhel10_cis_profile['base_profile'] }}


# -------------------------------------------------------------------------
# Play 2: Distribute to all target hosts
# -------------------------------------------------------------------------
- name: "Distribute Blueprint TOML to Target Hosts"
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/libexec/platform-python

  tasks:
    - name: Ensure /tmp/blueprints directory exists
      ansible.builtin.file:
        path: /tmp/blueprints
        state: directory
        mode: "0755"

    - name: Copy blueprint TOML to target host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/blueprints/rhel10_{{ platform }}_blueprint.toml"
        dest: "/tmp/blueprints/rhel10_{{ platform }}_blueprint.toml"
        mode: "0644"

    - name: Confirm file delivered
      ansible.builtin.debug:
        msg: "Blueprint TOML delivered to {{ inventory_hostname }}:/tmp/blueprints/rhel10_{{ platform }}_blueprint.toml"
