# playbooks/generate_tailoring_xml.yml
# =============================================================================
# Generates the OpenSCAP XCCDF tailoring file from cis_profile.yml.
# Variables are loaded explicitly via include_vars (not auto-loaded from
# group_vars) to avoid Jinja lookup failures on localhost.
#
# Run: ansible-playbook playbooks/generate_tailoring_xml.yml
# Output: files/qbe_cis_tailoring_rhel10.xml (single file, all environments)
# =============================================================================
---
- name: "Generate CIS Tailoring XML from CIS Profile YAML"
  hosts: localhost
  gather_facts: true
  connection: local
  vars:
    vars_dir: "{{ playbook_dir }}/group_vars"
    output_file: "{{ playbook_dir }}/files/qbe_cis_tailoring_rhel10.xml"

  tasks:
    - name: Load CIS profile variables
      ansible.builtin.include_vars:
        file: "{{ vars_dir }}/all/cis_profile.yml"

    - name: Validate CIS profile section exists
      ansible.builtin.assert:
        that:
          - cis_profile is defined
          - cis_profile['base_profile'] is defined
          - cis_profile['tailoring_id'] is defined
        fail_msg: "cis_profile.yml must contain a cis_profile section with base_profile and tailoring_id"

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_file | dirname }}"
        state: directory
        mode: "0755"
    
    - name: Install OpenSCAP packages
      ansible.builtin.raw: yum install -y openscap-scanner scap-security-guide
      become: true
      changed_when: false

    - name: Validate generated tailoring file
      ansible.builtin.command:
        cmd: >-
          oscap info {{ output_file }}
      register: oscap_validate
      changed_when: false
      failed_when: oscap_validate.rc != 0

    - name: Generate tailoring XML
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/cis_tailoring.xml.j2"
        dest: "{{ output_file }}"
        mode: "0644"

    - name: Validate generated tailoring file
      ansible.builtin.command:
        cmd: >-
          oscap info {{ output_file }}
      register: oscap_validate
      changed_when: false
      failed_when: oscap_validate.rc != 0

    - name: Report generation summary
      ansible.builtin.debug:
        msg: |
          Tailoring XML generated successfully:
            Output: {{ output_file }}
            Profile: {{ cis_profile['base_profile'] }}
            Rules disabled: {{ cis_profile['disabled_rules'] | default([]) | length }}
            Rules modified: {{ cis_profile['modified_rules'] | default([]) | length }}
