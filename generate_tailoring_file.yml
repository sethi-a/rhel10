# playbooks/generate_tailoring_xml.yml
# =============================================================================
# Generates the OpenSCAP XCCDF tailoring file from cis_profile.yml.
# Variables are loaded explicitly via include_vars (not auto-loaded from
# group_vars) to avoid Jinja lookup failures on localhost.
#
# Run: ansible-playbook playbooks/generate_tailoring_xml.yml
# Output: files/qbe_cis_tailoring_rhel10.xml (single file, all environments)
# =============================================================================
---
- name: "Generate CIS Tailoring XML from CIS Profile YAML"
  hosts: localhost
  gather_facts: true
  connection: local
  vars:
    vars_dir: "{{ playbook_dir }}/group_vars"
    output_file: "{{ playbook_dir }}/files/qbe_cis_tailoring_rhel10.xml"

  tasks:
    - name: Load CIS profile variables
      ansible.builtin.include_vars:
        file: "{{ vars_dir }}/all/cis_profile.yml"

    - name: Validate CIS profile section exists
      ansible.builtin.assert:
        that:
          - cis_profile is defined
          - cis_profile['base_profile'] is defined
          - cis_profile['tailoring_id'] is defined
        fail_msg: "cis_profile.yml must contain a cis_profile section with base_profile and tailoring_id"

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_file | dirname }}"
        state: directory
        mode: "0755"

    - name: Generate tailoring XML
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/cis_tailoring.xml.j2"
        dest: "{{ output_file }}"
        mode: "0644"

    - name: Read generated XML content
      ansible.builtin.slurp:
        src: "{{ output_file }}"
      register: tailoring_content

    - name: Display generated tailoring XML
      ansible.builtin.debug:
        msg: "{{ (tailoring_content.content | b64decode).split('\n') }}"

    - name: Set stats for AAP artifacts
      ansible.builtin.set_stats:
        data:
          tailoring_xml_content: "{{ tailoring_content.content | b64decode }}"
          tailoring_xml_profile: "{{ cis_profile['base_profile'] }}"
          tailoring_xml_disabled_rules: "{{ cis_profile['disabled_rules'] | default([]) | length }}"
          tailoring_xml_modified_rules: "{{ cis_profile['modified_rules'] | default([]) | length }}"

    - name: Report generation summary
      ansible.builtin.debug:
        msg: |
          Tailoring XML generated successfully:
            Output: {{ output_file }}
            Profile: {{ cis_profile['base_profile'] }}
            Rules disabled: {{ cis_profile['disabled_rules'] | default([]) | length }}
            Rules modified: {{ cis_profile['modified_rules'] | default([]) | length }}

# -------------------------------------------------------------------------
# Play 2: Distribute to all target hosts
# -------------------------------------------------------------------------
- name: "Distribute Tailoring XML to Target Hosts"
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/libexec/platform-python

  tasks:
    - name: Ensure /tmp/files directory exists
      ansible.builtin.file:
        path: /tmp/files
        state: directory
        mode: "0755"

    - name: Copy tailoring XML to target host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/qbe_cis_tailoring_rhel10.xml"
        dest: "/tmp/files/qbe_cis_tailoring_rhel10.xml"
        mode: "0644"

    - name: Confirm file delivered
      ansible.builtin.debug:
        msg: "Tailoring XML delivered to {{ inventory_hostname }}:/tmp/files/qbe_cis_tailoring_rhel10.xml"
