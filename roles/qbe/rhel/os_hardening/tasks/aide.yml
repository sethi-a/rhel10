# roles/os_hardening/tasks/aide.yml
---
- name: Ensure AIDE is installed
  ansible.builtin.package:
    name: aide
    state: present
  become: true

- name: Initialise AIDE database
  ansible.builtin.command:
    cmd: aide --init
    creates: /var/lib/aide/aide.db.new.gz
  become: true

- name: Move AIDE database to active location
  ansible.builtin.copy:
    src: /var/lib/aide/aide.db.new.gz
    dest: /var/lib/aide/aide.db.gz
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Schedule daily AIDE integrity check
  ansible.builtin.cron:
    name: "AIDE daily integrity check"
    minute: "30"
    hour: "4"
    job: "/usr/sbin/aide --check > /var/log/aide/aide-check.log 2>&1"
    user: root
  become: true
