# roles/baseline_check/tasks/main.yml
# Baseline variables (packages, services, ssh_config, etc.) are loaded
# automatically from group_vars/ by Ansible's variable precedence.
# No manual include_vars or combine() is needed.
---
    
- name: Initialise drift results structure
  ansible.builtin.set_fact:
    drift_results:
      hostname: "{{ inventory_hostname }}"
      region: "{{ region }}"
      environment: "{{ environment }}"
      scan_timestamp: "{{ ansible_date_time.iso8601 }}"
      baseline_version: "{{ baseline_version }}"
      categories: {}
      total_checks: 0
      total_drift: 0
      has_drift: false
    _pkg_drift: []
    _svc_drift: []
    _kernel_drift: []
    _file_drift: []
    _selinux_drift: []
    _mount_drift: []
    _firewall_drift: []
    _agent_drift: []
    _ssh_drift: []
    _pam_drift: []
    _login_defs_drift: []
    _banner_drift: []
    _cron_drift: []
    _audit_rules_drift: []
    _auditd_drift: []
    _rsyslog_drift: []
    _chrony_drift: []
    _dns_drift: []
    
- name: Run SELinux checks
  ansible.builtin.include_tasks: check_selinux.yml

# - name: Run package checks
#   ansible.builtin.include_tasks: check_packages.yml

- name: Run service checks
  ansible.builtin.include_tasks: check_services.yml

# - name: Run file permission checks
#   ansible.builtin.include_tasks: check_file_permissions.yml

# - name: Run filesystem mount checks
#   ansible.builtin.include_tasks: check_mounts.yml

# - name: Run firewall checks
#   ansible.builtin.include_tasks: check_firewall.yml

- name: Run agent configuration checks
  ansible.builtin.include_tasks: check_agents.yml

- name: Run SSH configuration checks
  ansible.builtin.include_tasks: check_ssh.yml

# - name: Run PAM configuration checks
#   ansible.builtin.include_tasks: check_pam.yml

# - name: Run login.defs checks
#   ansible.builtin.include_tasks: check_login_defs.yml

- name: Run banner checks
  ansible.builtin.include_tasks: check_banners.yml

- name: Run cron/at access checks
  ansible.builtin.include_tasks: check_cron_access.yml

# - name: Run audit rules checks
#   ansible.builtin.include_tasks: check_audit_rules.yml

# - name: Run auditd config checks
#   ansible.builtin.include_tasks: check_auditd_config.yml

# - name: Run rsyslog checks
#   ansible.builtin.include_tasks: check_rsyslog.yml

# - name: Run chrony/NTP checks
#   ansible.builtin.include_tasks: check_chrony.yml

# - name: Run DNS resolver checks
#   ansible.builtin.include_tasks: check_dns.yml

- name: Calculate overall drift summary
  ansible.builtin.set_fact:
    drift_results: >-
      {{
        drift_results | combine({
          'total_checks': drift_results.categories.values()
            | map(attribute='checks') | map('length') | sum,
          'total_drift': drift_results.categories.values()
            | map(attribute='drift_items') | map('length') | sum,
          'has_drift': drift_results.categories.values()
            | map(attribute='drift_items') | map('length') | sum > 0
        })
      }}
