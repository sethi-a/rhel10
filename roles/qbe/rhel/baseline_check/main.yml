# roles/baseline_check/tasks/main.yml
# Baseline variables (packages, services, ssh_config, etc.) are loaded
# automatically from group_vars/ by Ansible's variable precedence.
# No manual include_vars or combine() is needed.
---
- name: Initialise drift results structure
  ansible.builtin.set_fact:
    drift_results:
      hostname: "{{ inventory_hostname }}"
      region: "{{ region }}"
      environment: "{{ environment }}"
      scan_timestamp: "{{ ansible_date_time.iso8601 }}"
      baseline_version: "{{ baseline_version }}"
      categories: {}
      total_checks: 0
      total_drift: 0
      max_severity: "none"
      has_drift: false

# - name: Run package checks
#   ansible.builtin.include_tasks: check_packages.yml

# - name: Run service checks
#   ansible.builtin.include_tasks: check_services.yml

# - name: Run kernel parameter checks
#   ansible.builtin.include_tasks: check_kernel_params.yml

# - name: Run file permission checks
#   ansible.builtin.include_tasks: check_file_permissions.yml

- name: Run SELinux checks
  ansible.builtin.include_tasks: check_selinux.yml

# - name: Run filesystem mount checks
#   ansible.builtin.include_tasks: check_mounts.yml

# - name: Run firewall checks
#   ansible.builtin.include_tasks: check_firewall.yml

# - name: Run agent configuration checks
#   ansible.builtin.include_tasks: check_agents.yml

# - name: Run SSH configuration checks
#   ansible.builtin.include_tasks: check_ssh.yml

# - name: Run PAM configuration checks
