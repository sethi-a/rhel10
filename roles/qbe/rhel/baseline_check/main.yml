# - name: Run cron/at access checks
#   ansible.builtin.include_tasks: check_cron_access.yml

# - name: Run audit rules checks
#   ansible.builtin.include_tasks: check_audit_rules.yml

# - name: Run auditd config checks
#   ansible.builtin.include_tasks: check_auditd_config.yml

# - name: Run rsyslog checks
