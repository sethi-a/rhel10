- name: Calculate overall drift summary
  ansible.builtin.set_fact:
    drift_results: >-
      {{
        drift_results | combine({
          'total_checks': drift_results.categories.values()
            | map(attribute='checks') | map('length') | sum,
          'total_drift': drift_results.categories.values()
            | map(attribute='drift_items') | map('length') | sum,
          'has_drift': drift_results.categories.values()
            | map(attribute='drift_items') | map('length') | sum > 0,
          'max_severity': _severity_order[
            drift_results.categories.values()
            | map(attribute='drift_items') | flatten
            | map(attribute='severity') | map('extract', _severity_rank)
            | max | default(0)
          ] | default('none')
        })
      }}
  vars:
    _severity_rank:
      minor: 1
      moderate: 2
      major: 3
      critical: 4
    _severity_order:
      0: "none"
      1: "minor"
      2: "moderate"
      3: "major"
      4: "critical"
