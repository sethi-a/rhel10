# roles/qualys_install/tasks/main.yml
---
- name: Install Qualys Cloud Agent
  become: true
  ansible.builtin.dnf:
    name: "{{ agents.qualys.package }}"
    enablerepo: "{{ qualys_agent_repo }}"
    state: present

- name: Activate Qualys agent
  become: true
  ansible.builtin.command:
    cmd: >
      /usr/local/qualys/cloud-agent/bin/qualys-cloud-agent.sh
      ActivationId={{ qualys_activation_id }}
      CustomerId={{ qualys_customer_id }}
    creates: /etc/qualys/cloud-agent/agent-uuid
  no_log: true

- name: Ensure Qualys agent is running
  become: true
  ansible.builtin.systemd_service:
    name: "{{ agents.qualys.service }}"
    state: started
    enabled: true

- name: Verify Qualys agent connectivity
  become: true
  ansible.builtin.command:
    cmd: "{{ agents.qualys.validation_command }}"
  register: qualys_status
  changed_when: false
  failed_when: "qualys_status.stdout is not search(agents.qualys.expected_status_pattern)"
  retries: 5
  delay: 10
