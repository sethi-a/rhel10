---
- name: "Day 1 — Base OS Configuration (JT2)"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  tasks:
    # --- OS hardening (sysctl, firewall, SSH, SELinux, AIDE) ---
    - name: Apply OS hardening
      ansible.builtin.include_role:
        name: os_hardening


    - name: Configure time synchronisation
      ansible.builtin.include_role:
        name: timesync