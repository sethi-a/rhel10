# --- Satellite ---
satellite_validate_certs: true
satellite_organization: "QBE"

# --- Dynatrace ---
dynatrace_host_group: "qbe-linux"

# --- Email ---
smtp_server: "smtp.qbe.com"
smtp_port: 25

# Cross-region ops distribution list (for admin playbooks running on localhost)
ops_email_all:
  - "linux-ops-na@qbe.com"
  - "linux-ops-eu@qbe.com"
  - "linux-ops-apac@qbe.com"

# --- AAP Controller ---
aap_controller_url: "https://aap.qbe.com"
aap_project_id: 42

# --- Satellite Custom Repo Labels ---
qualys_agent_repo: "qbe-qualys-agent"
illumio_agent_repo: "qbe-illumio-ven"
defender_repo: "qbe-microsoft-defender"
dynatrace_repo: "qbe-dynatrace-oneagent"
bigfix_repo: "qbe-bigfix-agent"
ilmt_repo: "qbe-ilmt-scanner"
snow_discovery_repo: "qbe-snow-discovery"

# --- OS Hardening ---
crypto_policy: "FIPS"
build_accounts_to_remove:
  - "builder"
  - "deploy"
  - "packer"

# --- Active Directory ---
ad_domain: "qbe.com"
ad_ou: "OU=Linux,OU=Servers,DC=qbe,DC=com"
ad_join_user: "svc_adjoin"

# --- ServiceNow ---
snow_instance: "qbe.service-now.com"
snow_assignment_group: "Linux-Operations"