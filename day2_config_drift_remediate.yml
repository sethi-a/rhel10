# playbooks/d2_drift_remediate.yml
# =============================================================================
# Auto-remediation for non-prod hosts with minor/moderate drift.
# Self-contained — runs baseline_check first to detect current drift,
# then remediates and re-scans to verify.
#
# Category-to-role mappings are defined in group_vars/all/rhel10_remediation.yml.
# To add/change a mapping, edit that file — no playbook changes needed.
# =============================================================================
---
# =========================================================================
# Play 1: Detect drift and remediate
# =========================================================================
- name: "Day 2 -- Drift Auto-Remediation"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  serial: "{{ remediate_serial | default('10%') }}"
  gather_facts: true
  ignore_unreachable: true
  vars:
    drift_auto_remediate: >-
      {{ hostvars[inventory_hostname].drift_auto_remediate
         | default(environment != 'prod') }}

  tasks:
    # --- Step 1: Detect current drift ---
    - name: Run baseline check to detect current drift
      ansible.builtin.include_role:
        name: baseline_check

    - name: Map drifted categories to Day 1 roles
      ansible.builtin.set_fact:
        _drifted_roles_from_categories: >-
          {{ _drifted_categories
            | reject('equalto', 'agents')
            | map('extract', category_role_map)
            | select('string')
            | unique | list }}

    - name: Map drifted agents to Day 1 roles
      ansible.builtin.set_fact:
        _drifted_roles_from_agents: >-
          {{ (drift_results.categories.agents.drift_items | default([]))
            | map(attribute='item')
            | map('extract', agent_role_map)
            | select('defined')
            | unique | list }}
      when: "'agents' in _drifted_categories"

    - name: Combine category and agent roles
      ansible.builtin.set_fact:
        _drifted_role_names: >-
          {{ (_drifted_roles_from_categories + (_drifted_roles_from_agents | default([])))
            | unique | list }}

    # --- Step 3: Check eligibility ---
    - name: Check if host is in remediation_exclude group
      ansible.builtin.set_fact:
        _excluded: "{{ inventory_hostname in groups.get('remediation_exclude', []) }}"

    - name: Evaluate remediation eligibility
      ansible.builtin.set_fact:
        _eligible: >-
          {{ not _excluded | bool
             and drift_auto_remediate | bool
             and environment != 'prod'
             and drift_results.has_drift | bool
          }}
        _pre_drift_count: "{{ drift_results.total_drift }}"

    - name: Skip ineligible hosts
      ansible.builtin.debug:
        msg: >-
          Skipping {{ inventory_hostname }} —
          {% if _excluded | bool %}in remediation_exclude group
          {% elif not drift_auto_remediate | bool %}auto-remediate disabled
          {% elif environment == 'prod' %}production host
          {% elif not drift_results.has_drift | bool %}no drift detected
          {% else %}not eligible{% endif %}
      when: not _eligible | bool

    - name: Record skipped host result
      when: not _eligible | bool
      ansible.builtin.set_fact:
        remediation_result:
          hostname: "{{ inventory_hostname }}"
          environment: "{{ environment }}"
          region: "{{ region }}"
          excluded: "{{ _excluded | bool }}"
          skipped: true
          skip_reason: >-
            {% if _excluded | bool %}remediation_exclude group
            {% elif not drift_auto_remediate | bool %}auto-remediate disabled
            {% elif environment == 'prod' %}production host
            {% elif not drift_results.has_drift | bool %}no drift detected
            {% else %}not eligible{% endif %}
          roles_remediated: []
          post_scan_clean: "{{ not (drift_results.has_drift | default(false)) }}"
          pre_drift_count: "{{ drift_results.total_drift | default(0) }}"
          post_drift_count: "{{ drift_results.total_drift | default(0) }}"

    # --- Step 4: Remediate ---
    - name: Run auto-remediation
      when: _eligible | bool
      block:
        - name: Log remediation start
          ansible.builtin.debug:
            msg: >-
              Remediating {{ inventory_hostname }} — {{ _drifted_role_names | length }} roles:
              {{ _drifted_role_names | join(', ') }}

        - name: Remediate baseline packages
          ansible.builtin.include_role:
            name: packages_baseline
          when: "'packages_baseline' in _drifted_role_names"

        - name: Remediate OS hardening
          ansible.builtin.include_role:
            name: os_hardening
          when: "'os_hardening' in _drifted_role_names"

        - name: Remediate NTP/chrony
          ansible.builtin.include_role:
            name: timesync
          when: "'timesync' in _drifted_role_names"

        - name: Remediate Qualys agent
          ansible.builtin.include_role:
            name: qualys_install
          when: "'qualys_install' in _drifted_role_names"

        - name: Remediate SNOW Discovery agent
          ansible.builtin.include_role:
            name: snow_discovery_install
          when: "'snow_discovery_install' in _drifted_role_names"

         # --- Step 5: Re-scan to verify ---
        - name: Re-run baseline check after remediation
          ansible.builtin.include_role:
            name: baseline_check

        - name: Build post-remediation summary
          ansible.builtin.set_fact:
            remediation_result:
              hostname: "{{ inventory_hostname }}"
              environment: "{{ environment }}"
              region: "{{ region }}"
              excluded: false
              roles_remediated: "{{ _drifted_role_names }}"
              post_scan_clean: "{{ not (drift_results.has_drift | default(false)) }}"
              pre_drift_count: "{{ _pre_drift_count }}"
              post_drift_count: "{{ drift_results.total_drift | default(0) }}"

# =========================================================================
# Play 2: Report remediation outcome
# =========================================================================
- name: "Day 2 -- Drift Remediation Report"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  vars:
    all_results: >-
      {{ ansible_play_hosts_all
         | map('extract', hostvars, 'remediation_result')
         | select('defined') | list }}
    remediated_hosts: >-
      {{ all_results | rejectattr('skipped', 'defined') | list }}
    skipped_hosts: >-
      {{ all_results | selectattr('skipped', 'defined') | rejectattr('excluded', 'equalto', true) | list }}
    excluded_hosts: >-
      {{ all_results | selectattr('excluded', 'equalto', true) | list }}
    successful: >-
      {{ remediated_hosts | selectattr('post_scan_clean', 'equalto', true) | list }}
    failed: >-
      {{ remediated_hosts | rejectattr('post_scan_clean', 'equalto', true) | list }}

  tasks:
    - name: Print remediation summary
      ansible.builtin.debug:
        msg:
          - "Remediated: {{ remediated_hosts | length }} | Success: {{ successful | length }} | Failed: {{ failed | length }}"
          - "Skipped: {{ skipped_hosts | length }} | Excluded: {{ excluded_hosts | length }}"
          - "{% if excluded_hosts | length > 0 %}Excluded hosts: {{ excluded_hosts | map(attribute='hostname') | join(', ') }}{% endif %}"
      run_once: true
      delegate_to: localhost

    - name: Store remediation results as workflow artifact
      ansible.builtin.set_stats:
        data:
          remediation_total: "{{ remediated_hosts | length }}"
          remediation_successful: "{{ successful | length }}"
          remediation_failed: "{{ failed | length }}"
          remediation_skipped: "{{ skipped_hosts | length }}"
          remediation_excluded: "{{ excluded_hosts | length }}"
          remediation_results: "{{ all_results }}"
      run_once: true
      delegate_to: localhost
